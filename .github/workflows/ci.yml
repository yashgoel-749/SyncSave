name: SyncSpace CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/syncspace_test?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/syncspace_test?sslmode=disable"
      AUTH_SECRET: "ci-test-auth-secret-key-32-characters-minimum"
      NEXTAUTH_SECRET: "ci-test-auth-secret-key-32-characters-minimum"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_COLLAB_WS_URL: "ws://localhost:1234"
      PORT: "1234"
      ALLOWED_ORIGINS: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Linter
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Unit & Integration Test Suites
        run: npm test

      - name: Build All Packages (Web + Collab Server)
        env:
          NODE_ENV: production
        run: npm run build:all
